name: Deploy to VPS

on:
  push:
    branches:
      - dental_academico

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/link-pagamento-cliente
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_DENTAL_ACADEMICO }}
          port: ${{ secrets.VPS_PORT_DENTAL_ACADEMICO }}
          username: ${{ secrets.VPS_USER_DENTAL_ACADEMICO }}
          password: ${{ secrets.VPS_PASS_DENTAL_ACADEMICO }}
          script: |
            set -e
            echo '${{ secrets.GHCR_TOKEN }}' | podman login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin
            podman pull ghcr.io/${{ github.repository_owner }}/link-pagamento-cliente:latest

            if podman container exists link-pagamento-cliente; then
              podman rm -f link-pagamento-cliente
            fi

            podman run -d \
              --name link-pagamento-cliente \
              --restart=always \
              -p 8089:80 \
              ghcr.io/${{ github.repository_owner }}/link-pagamento-cliente:latest
